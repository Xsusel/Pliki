server {
    listen 80;
    server_name pliki.xsus.pl;

    # Maximum upload size
    client_max_body_size 100G;

    location / {
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal location for X-Accel-Redirect (Fast Downloads)
    # The 'internal' directive ensures this location cannot be accessed directly by clients
    location /protected_files/ {
        internal;
        # CHANGE THIS PATH to the absolute path of your 'uploads' directory
        alias /var/www/pliki-xsus/uploads/;
    }

    # Serve static files directly (CSS, JS, Images)
    location /static/ {
        # CHANGE THIS PATH to the absolute path of your 'static' directory
        alias /var/www/pliki-xsus/static/;
    }
}
